dependencies {
    testCompileOnly 'org.asciidoctor:asciidoctorj:2.5.7'
    testCompileOnly 'org.asciidoctor:asciidoctorj-pdf:1.6.2'

    testImplementation "com.epages:restdocs-api-spec-mockmvc:${restdocs_version}"
    testImplementation "org.springframework.restdocs:spring-restdocs-mockmvc:3.0.1"
}

javadoc {
    destinationDir = file("../docs/EJournal_Client/javaDoc")
    options.encoding = 'UTF-8'
    options.memberLevel = JavadocMemberLevel.PACKAGE
    options.overview = 'src/docs/docDescriptionJavaDoc.html'
}

asciidoctorPdf {
    sourceDir '../'
    outputDir '../docs/EJournal_Client/asciiDoc'
    asciidoctorj {
        attributes \
            'icons': 'font',
                'idseparator': '-',
                'docinfo': 'shared',
                'source-highlighter' : 'rouge'
    }
}

asciidoctor {
    sourceDir '../'
    sources {
        exclude '/server/', '/server1/', '/docs/', '/imgAsciiDoc/', '/EJournal_Client/'
    }
    outputDir '../docs/EJournal_Client/asciiDoc'
    baseDirFollowsSourceFile()
    resources {
        from(sourceDir) {
            include 'imgAsciiDoc/**'
        }
    }
    attributes \
        'icons': 'font',
//        'snippets': file("build/generated-snippets"),
            'idseparator': '-',
            'docinfo': 'shared'
//    dependsOn asciidoctorPdf
}

openapi3 {
    servers = [ { url = "http://localhost:8080" } ]
    title = 'EJournal'
    description = file('src/docs/docDescriptionSwagger.html').text
    tagDescriptionsPropertiesFile = 'src/docs/swagger/tags.yaml'
    version = '1.0'
    format = 'json'
    outputDirectory = '../docs/EJournal_Client/swagger/htmlSwag'
    outputFileNamePrefix = 'swagger'
    snippetsDirectory = "build/generated-snippets"
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':openapi3')) {
        test.enabled = false
    }
}